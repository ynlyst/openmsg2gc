
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Genesys Cloud Open Messaging Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 720px;
      margin: 30px auto;
      padding: 20px;
      background: #f1f5f9;
      color: #1e293b;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      margin-top: 6px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
    }
    button {
      margin-top: 20px;
      padding: 12px 18px;
      background: #123456;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    pre {
      background: #172033;
      color: #b9f6ca;
      padding: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Genesys Open Messaging</h1>
    <p>Singapore region: apse1</p>

    <label for="integrationId">Open Messaging Integration ID</label>
    <input id="integrationId"
           placeholder="Paste integration ID">

    <label for="token">OAuth Access Token</label>
    <input id="token" type="password"
           autocomplete="off"
           placeholder="Paste access token">

    <label for="customerId">Customer ID</label>
    <input id="customerId" value="web-customer-001">

    <label for="message">Message</label>
    <textarea id="message">Hello, I need help with my account.</textarea>

    <button id="sendButton" onclick="sendMessage()">
      Send to Genesys Cloud
    </button>

    <h3>Result</h3>
    <pre id="result">Ready.</pre>
  </div>

  <script>
    const API_BASE = "https://api.apse1.pure.cloud";

    async function sendMessage() {
      const integrationId =
        document.getElementById("integrationId").value.trim();
      const token =
        document.getElementById("token").value.trim();
      const customerId =
        document.getElementById("customerId").value.trim();
      const message =
        document.getElementById("message").value.trim();
      const result = document.getElementById("result");
      const button = document.getElementById("sendButton");

      if (!integrationId || !token || !customerId || !message) {
        result.textContent = "Please fill in all fields.";
        return;
      }

      button.disabled = true;
      result.textContent = "Sending request...";

      const url =
        API_BASE +
        "/api/v2/conversations/messages/" +
        encodeURIComponent(integrationId) +
        "/inbound/open/message?prefetchConversationId=true";

      const payload = {
        text: message,
        channel: {
          from: {
            id: customerId,
            idType: "Opaque"
          },
          time: new Date().toISOString(),
          messageId: crypto.randomUUID()
        }
      };

      try {
        const response = await fetch(url, {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const text = await response.text();

        result.textContent =
          "HTTP Status: " + response.status +
          "\n\nResponse:\n" + (text || "(empty response)");

        if (response.ok) {
          result.textContent +=
            "\n\nRequest accepted by Genesys Cloud.";
        }
      } catch (error) {
        result.textContent =
          "Request failed: " + error.message +
          "\n\nCheck the API endpoint, browser CORS restrictions, " +
          "and network connectivity.";
      } finally {
        button.disabled = false;
      }
    }
  </script>
</body>
</html>
